[package]
name = "pg_jsonschema"
version = "0.3.4"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[features]
default = ["pg16"]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15"]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18"]
pg19 = ["pgrx/pg19", "pgrx-tests/pg19"]
pg_test = []

[dependencies]
pgrx = "0.20.1"
serde = "1.0"
serde_json = "1.0"
jsonschema = { version = "0.58.0", default-features = false, features = [
    "arbitrary-precision",
    "jsonb",
] }
lru = { version = "0.16", default-features = false }

[dev-dependencies]
pgrx-tests = "0.20.1"

[profile.dev]
panic = "unwind"
lto = "thin"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
